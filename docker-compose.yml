# Freebuff Endpoint — compose for 24/7 hosting (any VPS or local Docker Desktop)
services:
  freebuff-endpoint:
    build: .
    container_name: freebuff-endpoint
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Config + credentials live outside the image; token auto-detection reads
      # the manicode credentials mounted here.
      - ./config.json:/app/config.json:ro
      - ${USERPROFILE}/.config/manicode:/manicode-creds:ro
    environment:
      - MANICODE_CREDS_DIR=/manicode-creds
      # Override anything from config.json here, e.g.:
      # - PROXY_URL=socks5://user:pass@host:port
      # - AUTH_TOKENS=token1,token2
      # - API_KEYS=your-client-key
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
