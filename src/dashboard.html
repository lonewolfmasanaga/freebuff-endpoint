<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freebuff Endpoint</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    padding: 32px 24px; max-width: 640px; margin: 0 auto;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); display: inline-block; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  main {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px; margin-top: 20px;
  }
  h1 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .field { margin-top: 20px; }
  .field > label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 8px; }

  .egress {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    background: #0d1117; font-size: 14px;
  }
  .egress .mode { font-family: ui-monospace, Consolas, monospace; }
  .egress .lbl { color: var(--muted); font-size: 12px; margin-left: auto; }

  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; font: inherit; color: var(--fg); background: #0d1117;
    border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  .row input:focus { outline: 1px solid var(--accent); }
  button {
    font: inherit; color: var(--fg); cursor: pointer;
    border: 1px solid #2ea043; border-radius: 7px; padding: 10px 16px;
    background: #238636; font-weight: 600;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .6; cursor: default; filter: none; }

  .msg { display: none; margin-top: 12px; font-size: 13px; line-height: 1.5; padding: 9px 12px; border-radius: 7px; }
  .msg.show { display: block; }
  .msg.ok { color: var(--accent); background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.35); }
  .msg.err { color: var(--err); background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.35); }

  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.6; }
  .hint code, footer code { background: #21262d; border-radius: 5px; padding: 1px 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  footer { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.9; }
  footer code { font-size: 11px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Freebuff Endpoint</h1>
  <div class="sub" id="subtitle">checking…</div>

  <main>
    <div class="field">
      <label>Current egress</label>
      <div class="egress">
        <span class="mode" id="proxyMode">loading…</span>
        <span class="lbl" id="modelsCount"></span>
      </div>
    </div>

    <div class="field">
      <label>Upstream proxy</label>
      <div class="row">
        <input id="proxyUrl" type="text" placeholder="socks5://... or http(s)://... — empty = direct" autocomplete="off" spellcheck="false">
        <button id="applyBtn" type="button">Apply</button>
      </div>
      <div class="msg" id="msg"></div>
      <p class="hint">Applies live to upstream traffic — next request uses it, no restart. An empty value restores direct egress.</p>
    </div>
  </main>

  <footer>
    OpenAI surface: <code>POST /v1/chat/completions</code><br>
    Anthropic surface: <code>POST /v1/messages</code> — models: <code>GET /v1/models</code><br>
    Health: <code>GET /healthz</code>
  </footer>

<script>
const $ = (id) => document.getElementById(id);
let msgTimer = null;

function flash(text, kind) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + kind;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.className = 'msg'; }, 4000);
}

async function api(path, opts) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const body = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, body };
}

async function refresh() {
  const [health, proxy] = await Promise.allSettled([api('/health'), api('/admin/proxy')]);
  if (health.status === 'fulfilled' && health.value.ok) {
    const b = health.value.body;
    $('dot').classList.add('ok');
    $('subtitle').textContent = `${b.models} models available · ${b.tokens} token(s)`;
    $('modelsCount').textContent = `${b.models} models`;
  } else {
    $('dot').classList.remove('ok');
    $('subtitle').textContent = 'gateway unreachable';
  }
  if (proxy.status === 'fulfilled' && proxy.value.ok) {
    const b = proxy.value.body;
    $('proxyMode').textContent = b.proxy || 'direct (no proxy)';
    if ($('proxyUrl') !== document.activeElement) $('proxyUrl').value = b.configured || '';
  }
}

$('applyBtn').onclick = async () => {
  const btn = $('applyBtn');
  btn.disabled = true;
  btn.textContent = 'Applying…';
  try {
    const { ok, body } = await api('/admin/proxy', {
      method: 'POST',
      body: JSON.stringify({ proxyUrl: $('proxyUrl').value.trim() }),
    });
    if (!ok) throw new Error(body?.error?.message || body?.error || 'apply failed');
    $('proxyMode').textContent = body.proxy;
    flash(`Egress switched to: ${body.proxy}`, 'ok');
  } catch (e) {
    flash(`Could not apply proxy: ${e.message}`, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Apply';
  }
};

$('proxyUrl').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('applyBtn').click(); }
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
